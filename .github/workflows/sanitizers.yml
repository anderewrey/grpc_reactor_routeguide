name: sanitizers

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Weekly, on master only (GitHub runs schedules on the default branch): catches breakage from the
  # runner image and toolchain updates without waiting for a commit.
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# The event is part of the key: the weekly run and a push to master share the ref, and would
# otherwise cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Unlike ci.yml's sanitizer variants, which instrument only this project's code against
  # uninstrumented system packages, this builds the whole dependency stack (gRPC bundle, OpenSSL,
  # zlib, spdlog, gflags, gtest, EventLoop) through vcpkg with the same sanitizer.
  sanitize:
    name: sanitize (${{ matrix.sanitizer }})
    # No container: TSan needs the host sysctl below, which a job container cannot set.
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - sanitizer: asan
            preset: vcpkg-clang-asan
            triplet: x64-linux-clang-asan
            instrumentation_symbol: __asan_report_
          - sanitizer: tsan
            preset: vcpkg-clang-tsan
            triplet: x64-linux-clang-tsan
            instrumentation_symbol: __tsan_func_entry
    steps:
      - uses: actions/checkout@v5

      # Recent kernels' default mmap ASLR entropy collides with the sanitizer runtimes' fixed
      # shadow memory layout.
      - name: Lower mmap ASLR entropy
        run: sudo sysctl vm.mmap_rnd_bits=28

      # vcpkg fetches its own ninja for the ports, but the project's own configure needs one on PATH.
      - name: Install Ninja
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends ninja-build

      # Checked out at the registry baseline of vcpkg-configuration.json rather than master: vcpkg's
      # helper scripts are part of every package's ABI hash, so a moving vcpkg would invalidate the
      # whole binary cache whenever they change.
      - name: Get vcpkg
        run: |
          baseline=$(jq -r '."default-registry".baseline' vcpkg-configuration.json)
          git init -q "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" fetch -q --depth 1 https://github.com/microsoft/vcpkg.git "$baseline"
          git -C "$RUNNER_TEMP/vcpkg" checkout -q FETCH_HEAD
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"

      # vcpkg binary cache: vcpkg's files provider, one zip per package and ABI hash, kept in the
      # Actions cache. Each run restores its branch's latest archive, or master's, so a changed port
      # rebuilds only itself and what depends on it. A new archive is saved only when a package was
      # built or pruned (see "Prune the vcpkg binary cache").
      - name: Restore the vcpkg binary cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: vcpkg-${{ matrix.triplet }}-${{ github.ref }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vcpkg-${{ matrix.triplet }}-${{ github.ref }}-
            vcpkg-${{ matrix.triplet }}-refs/heads/master-

      - name: Set up the vcpkg binary cache
        id: setup-cache
        run: |
          cache="$RUNNER_TEMP/vcpkg-binary-cache"
          mkdir -p "$cache"
          find "$cache" -name '*.zip' -printf '%P\n' | sort > "$RUNNER_TEMP/cache-before.txt"
          echo "Restored $(wc -l < "$RUNNER_TEMP/cache-before.txt") packages"
          echo "VCPKG_BINARY_SOURCES=clear;files,$cache,readwrite" >> "$GITHUB_ENV"

      # Configure runs vcpkg's manifest install. protoc and grpc_cpp_plugin are ASan-instrumented
      # too and run during the build, so LeakSanitizer is off until the Test step.
      - name: Configure (builds dependencies)
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: cmake --preset ${{ matrix.preset }}

      # A dependency built without the sanitizer still links and passes (ASan tolerates it), so check
      # that each installed library actually references the sanitizer runtime.
      - name: Check dependencies are instrumented
        run: |
          lib_dir=cmake-build-vcpkg-${{ matrix.sanitizer }}-clang/vcpkg_installed/${{ matrix.triplet }}/lib
          status=0
          for lib in libgrpc++.a libgrpc.a libprotobuf.a libabsl_base.a libcares.a libre2.a libssl.a \
                     libcrypto.a libz.a libgflags.a libgtest.a libspdlog.a libfmt.a; do
            if nm -A "$lib_dir/$lib" 2>/dev/null | grep -q "${{ matrix.instrumentation_symbol }}"; then
              echo "ok      $lib"
            else
              echo "MISSING $lib"; status=1
            fi
          done
          # Upstream's CMakeLists.txt always builds EventLoop as a shared library, whatever the triplet.
          if nm -D "$lib_dir/libEventLoop.so" 2>/dev/null | grep -q "${{ matrix.instrumentation_symbol }}"; then
            echo "ok      libEventLoop.so"
          else
            echo "MISSING libEventLoop.so"; status=1
          fi
          exit $status

      - name: Build
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: cmake --build cmake-build-vcpkg-${{ matrix.sanitizer }}-clang

      # ASAN_OPTIONS: same runtime options as ci.yml's sanitizer variants. Each runtime ignores the
      # other sanitizer's variable, so both are set for every matrix entry.
      - name: Test
        env:
          TSAN_OPTIONS: >-
            halt_on_error=1 second_deadlock_stack=1
            external_symbolizer_path=/usr/lib/llvm-18/bin/llvm-symbolizer
          ASAN_OPTIONS: >-
            detect_invalid_pointer_pairs=2 quarantine_size_mb=512 strict_string_checks=1
            detect_stack_use_after_return=1 detect_leaks=1 check_initialization_order=1 strict_init_order=1
          ASAN_SYMBOLIZER_PATH: /usr/lib/llvm-18/bin/llvm-symbolizer
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --test-dir cmake-build-vcpkg-${{ matrix.sanitizer }}-clang --output-on-failure

      # vcpkg only names its failed port's logs; print them so the job output shows the cause.
      - name: Show vcpkg logs
        if: failure()
        run: |
          shopt -s nullglob
          for log in "$VCPKG_ROOT"/buildtrees/*/*-err.log "$VCPKG_ROOT"/buildtrees/*/*-out.log \
                     "$VCPKG_ROOT"/buildtrees/*/*/CMakeFiles/CMakeConfigureLog.yaml; do
            echo "::group::$log"
            tail -n 300 "$log"
            echo "::endgroup::"
          done

      # Marks every package this run installed as used (its zip's modification time, which the cache
      # archive preserves), then deletes the packages no run saved as used for 30 days. Pruning by
      # age rather than by this run's use keeps the packages of branches still on older ports; a
      # branch's own archive expires once unused for 7 days (GitHub's cache eviction). Skipped when
      # vcpkg recorded no ABI hash, so a run that failed early deletes nothing.
      - name: Prune the vcpkg binary cache
        id: prune
        if: ${{ always() && steps.setup-cache.outcome == 'success' }}
        run: |
          cache="$RUNNER_TEMP/vcpkg-binary-cache"
          status_file=cmake-build-vcpkg-${{ matrix.sanitizer }}-clang/vcpkg_installed/vcpkg/status
          used="$RUNNER_TEMP/used-abis.txt"
          if [ -f "$status_file" ]; then
            sed -n 's/^Abi: //p' "$status_file" | sort -u > "$used"
          fi
          if [ -s "$used" ]; then
            find "$cache" -name '*.zip' | while read -r zip; do
              if grep -qxF "$(basename "$zip" .zip)" "$used"; then touch "$zip"; fi
            done
            echo "Pruning packages unused for 30 days:"
            find "$cache" -name '*.zip' -mtime +30 -print -delete
          else
            echo "::warning::No ABI hash recorded by vcpkg, the binary cache is not pruned"
          fi
          find "$cache" -name '*.zip' -printf '%P\n' | sort > "$RUNNER_TEMP/cache-after.txt"
          if cmp -s "$RUNNER_TEMP/cache-before.txt" "$RUNNER_TEMP/cache-after.txt"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Saved even when a later step failed or the run was cancelled, so a cold build keeps what it
      # already built.
      - name: Save the vcpkg binary cache
        if: ${{ always() && steps.prune.outputs.changed == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: ${{ steps.cache.outputs.cache-primary-key }}
